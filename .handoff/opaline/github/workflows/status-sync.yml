name: Status sync
# Copies a new status:* label into the project Status field, so the board follows the agents (they can't edit Projects).
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
      label:
        description: Label to apply, e.g. status:review
        required: true
      dry_run:
        description: Only print what would change
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.label.name, 'status:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/agents/sync_status_field.py ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue || github.event.issue.number }}
          LABEL: ${{ inputs.label || github.event.label.name }}
