name: Bug
description: Something is broken
labels: ["bug", "agent:dev", "status:todo"]
body:
  - type: dropdown
    id: where
    attributes: { label: Where, options: [Web, iOS app, Both, Server / generation] }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened, description: And what you expected }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: input
    id: env
    attributes: { label: Build / device / browser, placeholder: "iOS 1.0 (5), iPhone 15 · or Safari 26 on the web" }
  - type: textarea
    id: logs
    attributes: { label: Logs / batch id / Vercel log link, render: text }
