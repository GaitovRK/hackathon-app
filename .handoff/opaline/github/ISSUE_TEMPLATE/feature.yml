name: Feature
description: A new feature or improvement
labels: ["status:todo"]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem / goal, description: "What seller problem does this solve?" }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: Idea }
    validations: { required: true }
  - type: dropdown
    id: where
    attributes: { label: Where, options: [Web, iOS app, Both, Server only] }
  - type: textarea
    id: evidence
    attributes: { label: Evidence, description: Data, competitor apps, marketing findings, critic verdict }
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] 
        - [ ] EN + TR copy
        - [ ] Tests added
        - [ ] Metric to measure it
    validations: { required: true }
