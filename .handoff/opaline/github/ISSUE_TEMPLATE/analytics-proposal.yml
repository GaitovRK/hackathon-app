name: Analytics proposal
description: A change suggested by the data (for product or dev)
labels: ["status:todo"]
body:
  - type: textarea
    id: finding
    attributes: { label: Finding, description: The numbers, period and query }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposal }
    validations: { required: true }
  - type: input
    id: metric
    attributes: { label: Success metric and target, placeholder: "Activation +10pp, failed images < 3%" }
    validations: { required: true }
  - type: dropdown
    id: owner
    attributes: { label: Owner, options: [agent:product, agent:dev] }
